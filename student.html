<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>作問の森 生徒ページ</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#f4fff1;
    background-image: radial-gradient(#e0f2cb 20%, transparent 20%);
    background-size: 20px 20px;
    margin:0;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
}

h1{
    color:#2e7d32;
}

.section{
    background:white;
    padding:20px;
    margin:20px 0;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input,
select{
    width:90%;
    padding:12px;
    font-size:18px;
    margin:10px 0;
}

button{
    width:90%;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:8px 0;
}

.answer-btn{
    background:#4caf50;
    color:white;
}

.fun{
    background:#ffb6c1;
}

.useful{
    background:#fff59d;
}

.difficult{
    background:#ffcc80;
}

.message{
    margin-top:15px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>🌳 作問の森</h1>

<div class="section">

<h2>回答する</h2>

<select id="question-select">

<option value="1">問題1</option>
<option value="2">問題2</option>
<option value="3">問題3</option>
<option value="4">問題4</option>
<option value="5">問題5</option>

<input
    type="text"
    id="student-name"
    placeholder="名前">

<input
    type="text"
    id="student-answer"
    placeholder="答えをひらがなで入力">


</select>

<button
    class="answer-btn"
    onclick="sendAnswer()">

    回答を送信

</button>

<div
    id="answer-message"
    class="message">
</div>

</div>

<h2>問題を評価する</h2>

</div>

</div>

<script>
// 回答用GAS
const ANSWER_GAS_URL =
"https://script.google.com/macros/s/AKfycby6wQFYHOi0Dp2m3sxSm8uuoxMMzEEzVFtXbEY3uKLiTUn_QhZmlxVcyXEwDjBfSOMH/exec";
// 評価用GAS
const RATING_GAS_URL =
"https://script.google.com/macros/s/AKfycbzkpgy5OvzHBtNYRGPcyQcgWJXjBPqlHSHGGUNH8OOA8y3KRTS0ELauOFQUkz1XW3TWaA/exec";

function sendAnswer(){

    const name =
        document.getElementById(
            "student-name"
        ).value.trim();

    const answer =
        document.getElementById(
            "student-answer"
        ).value.trim();

    const questionId =
        document.getElementById(
            "question-select"
        ).value;

    if(name === "" || answer === ""){

        document
        .getElementById(
            "answer-message"
        ).textContent =
        "名前と回答を入力してください";

        return;
    }

    document
    .getElementById(
        "answer-message"
    ).textContent =
    "送信中...";

    fetch(
        ANSWER_GAS_URL,
        {
            method:"POST",

            body:JSON.stringify({

                name:name,
                answer:answer,
                questionId:questionId

            })

        }
    )
    .then(response => response.text())
    .then(data => {

        document
        .getElementById(
            "answer-message"
        ).textContent =
        "✅ 回答を送信しました";

        document
        .getElementById(
            "student-answer"
        ).value = "";

    })
    .catch(error => {

        console.error(error);

        document
        .getElementById(
            "answer-message"
        ).textContent =
        "❌ 送信失敗";

    });

}

function sendRating(rating){

    const questionId =
        document.getElementById(
            "question-select"
        ).value;

    document
    .getElementById(
        "rating-message"
    ).textContent =
    "送信中...";

    fetch(
        RATING_GAS_URL +
        "?questionId=" +
        questionId +
        "&rating=" +
        encodeURIComponent(
            rating
        )
    )
    .then(response => response.text())
    .then(data => {

        document
        .getElementById(
            "rating-message"
        ).textContent =
        "✅ 評価ありがとうございました";

    })
    .catch(error => {

        console.error(error);

        document
        .getElementById(
            "rating-message"
        ).textContent =
        "❌ 送信失敗";

    });

}

</script>

</body>
</html>
