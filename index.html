<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>作問の森 - ホーム画面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="forest-mode">
    <img src="picture/yama.png" alt="山の背景" class="home-bg-image">
    <header class="forest-header">
        <h1>🌳 作問の森</h1>
        <div class="header-spacer"></div>
    </header>

    <div class="container home-container">
        <div class="hero-card">
            <img src="picture/logo.png" alt="作問の森ロゴ" class="site-logo">
            <p class="subtitle">みんなが作った問題を集めてクイズ大会をしよう！</p>

            <div class="menu-box">
                <button id="open-start-modal" class="btn btn-play">クイズを解く</button>
            </div>

            <div id="start-modal" class="start-modal">
                <div class="start-modal-content">
                    <button type="button" class="modal-close-btn" id="close-start-modal" aria-label="戻る">←</button>
                    <h2>🌳 クイズの準備</h2>

                    <div class="game-rule">
                        <p>🔊 効果音があります。音量に気を付けてね。</p>
                        <p>📝 こたえはひらがなで入力してね</p>
                        <p>💣 制限時間は90秒です</p>
                        <p>🎯 5こせいかいすると次の問題へ！</p>
                    </div>

                    <p>あなたの名前（班名でもOK）</p>
                    <input type="text" id="player-name" placeholder="名前を入力">

                    <h3>出題ジャンル</h3>
                    <div class="genre-list">
                        <label><input type="checkbox" value="国語">国語</label>
                        <label><input type="checkbox" value="算数">算数</label>
                        <label><input type="checkbox" value="理科">理科</label>
                        <label><input type="checkbox" value="社会">社会</label>
                        <label><input type="checkbox" value="その他">その他</label>
                    </div>

                    <button id="start-quiz-btn" class="btn btn-play">スタート</button>
                    <p class="hiragana-note">こたえはひらがなで入力してね</p>
                </div>
            </div>
        </div>

        <section class="ranking-card">
            <h2>🏆 人気問題ランキング</h2>
            <p class="ranking-description">面白かった・勉強になった・難しかったの合計で並べています。</p>
            <ol id="ranking-list" class="ranking-list"></ol>
        </section>

        <div class="guide-link-row">
            <a href="teacher.html" class="btn btn-play">システム導入ガイド</a>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
